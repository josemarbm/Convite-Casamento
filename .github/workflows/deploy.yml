  # ============================================================
  # WEB - PREVIEW
  # ============================================================

  deploy-preview:
    name: Deploy Preview

    runs-on: ubuntu-latest
    environment: Production

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Show API URL
        run: |
          echo "🔗 API URL:"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Preview
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "❌ VERCEL_TOKEN não configurado"
            exit 1
          fi

          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "❌ VERCEL_WEB_PROJECT_ID não configurado"
            exit 1
          fi

          if [ -z "$API_URL" ]; then
            echo "❌ API_URL não foi recebido do job deploy-api-production"
            exit 1
          fi

          echo "🚀 Deploy Web Preview"
          echo "🔗 API: $API_URL"

          vercel deploy \
            --prod
            --yes \
            --token="$VERCEL_TOKEN" \
            --project="$VERCEL_PROJECT_ID"


  # ============================================================
  # WEB - PRODUCTION
  # ============================================================

  deploy-production:
    name: Deploy Web Production

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest
    environment: Production

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Production
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          # API_URL: ${{ needs.deploy-api-production.outputs.api_url }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "❌ VERCEL_TOKEN não configurado"
            exit 1
          fi

          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "❌ VERCEL_WEB_PROJECT_ID não configurado"
            exit 1
          fi

          echo "🚀 Deploy Web Production"
          echo "🔗 API: $API_URL"

          vercel deploy \
            --prod \
            --yes \
            --token="$VERCEL_TOKEN" \
            --project="$VERCEL_PROJECT_ID"
