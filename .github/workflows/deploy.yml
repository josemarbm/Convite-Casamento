name: CI/CD Vercel

on:
  push:
    branches:
      - main
      - develop
      - "feature/*"

  pull_request:
    types:
      - opened
      - synchronize

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:

