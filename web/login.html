<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sistema de Convites de Casamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/enhancements.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: var(--gradient-bg);
        font-family: var(--font-sans);
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <!-- Hero Section -->
      <aside class="login-hero">
        <span class="brand-badge">💍 Casamento</span>
        <h1>Gerencie os convites com calma</h1>
        <p>Centralize convidados, mensagens e envios em uma interface elegante e clara.</p>
      </aside>

      <!-- Login Panel -->
      <section class="login-panel">
        <div class="login-header">
          <h2>Bem-vindo de volta</h2>
          <p>Acesse sua conta para continuar</p>
        </div>

        <div id="login-message" class="message"></div>

        <form id="login-form" class="login-form">
          <div class="form-group">
            <label for="login-username">Usuário</label>
            <input
              type="text"
              id="login-username"
              name="username"
              placeholder="Digite seu usuário"
              required
            />
          </div>

          <div class="form-group">
            <label for="login-password">Senha</label>
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="Digite sua senha"
              required
            />
          </div>

          <button type="submit" class="submit-btn" id="login-btn">
            Entrar
          </button>
        </form>
      </section>
    </div>

    <script>
      // API Client
      const API_BASE =
        window.location.hostname === 'localhost'
          ? 'http://localhost:5000/api'
          : 'http://backend:5000/api';

      function showMessage(containerId, message, type) {
        const messageEl = document.getElementById(containerId);
        messageEl.textContent = message;
        messageEl.className = `message show ${type}`;
        
        if (type === 'success') {
          setTimeout(() => {
            messageEl.className = 'message';
          }, 3000);
        }
      }

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('login-btn');
        
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span>';
        
        try {
          const response = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
          });
          
          const data = await response.json();
          
          if (!response.ok) {
            showMessage('login-message', data.error || 'Erro ao fazer login', 'error');
            btn.disabled = false;
            btn.innerHTML = 'Entrar';
            return;
          }
          
          // Store token
          localStorage.setItem('auth_token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          showMessage('login-message', 'Login realizado! Redirecionando...', 'success');
          setTimeout(() => {
            window.location.href = '/';
          }, 1500);
          
        } catch (error) {
          showMessage('login-message', 'Erro de conexão. Tente novamente.', 'error');
          btn.disabled = false;
          btn.innerHTML = 'Entrar';
        }
      });

      // Apply theme
      const theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    </script>
  </body>
</html>
