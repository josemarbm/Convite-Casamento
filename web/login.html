<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sistema de Convites de Casamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/enhancements.css" />
    <style>
      /* ===== Login Page Styles ===== */
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: var(--gradient-bg);
        font-family: var(--font-sans);
      }

      .login-container {
        background: var(--bg-elevated);
        padding: var(--spacing-lg);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-soft);
        width: 100%;
        max-width: 400px;
        border: 1px solid var(--border);
        animation: fadeIn 0.6s ease-out;
      }

      .login-header {
        text-align: center;
        margin-bottom: var(--spacing-lg);
      }

      .login-header h1 {
        font-size: 2rem;
        margin: 0;
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .login-header p {
        font-size: 0.9rem;
        color: var(--text-muted);
        margin: var(--spacing-sm) 0 0 0;
      }

      .form-group {
        margin-bottom: var(--spacing-md);
      }

      .form-group label {
        display: block;
        margin-bottom: var(--spacing-xs);
        font-weight: 500;
        color: var(--text-strong);
      }

      .form-group input {
        width: 100%;
        padding: var(--spacing-sm);
        border: 2px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 1rem;
        transition: all 0.3s ease;
        background: var(--bg-surface);
        color: var(--text-strong);
        box-sizing: border-box;
        font-family: var(--font-sans);
      }

      .form-group input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        background: var(--bg-elevated);
      }

      .form-group input::placeholder {
        color: var(--text-muted);
      }

      .submit-btn {
        width: 100%;
        padding: var(--spacing-sm);
        background: var(--gradient-primary);
        color: white;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: var(--spacing-md);
        box-shadow: var(--shadow-soft);
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      .submit-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
      }

      .toggle-form {
        text-align: center;
        margin-top: var(--spacing-md);
        font-size: 0.9rem;
      }

      .toggle-form a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .toggle-form a:hover {
        color: var(--primary-strong);
        text-decoration: underline;
      }

      .message {
        padding: var(--spacing-sm);
        border-radius: var(--radius-sm);
        margin-bottom: var(--spacing-md);
        display: none;
        text-align: center;
        font-size: 0.9rem;
        border: 1px solid;
        animation: slideDown 0.3s ease-out;
      }

      .message.show {
        display: block;
      }

      .message.error {
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger);
        border-color: var(--danger);
      }

      .message.success {
        background: rgba(16, 185, 129, 0.1);
        color: var(--success);
        border-color: var(--success);
      }

      .loading-spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Light theme overrides */
      [data-theme="light"] {
        --bg-page: #f8fafc;
        --bg-surface: #f1f5f9;
        --bg-elevated: #ffffff;
        --text-strong: #1e293b;
        --text-muted: #64748b;
        --border: rgba(100, 116, 139, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <!-- Login Form -->
      <div id="login-form-container" class="form-container">
        <div class="login-header">
          <h1>💍</h1>
          <h1>Convites</h1>
          <p>Sistema de Casamento</p>
        </div>

        <div id="login-message" class="message"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="login-username">Usuário</label>
            <input
              type="text"
              id="login-username"
              name="username"
              placeholder="Digite seu usuário"
              required
            />
          </div>

          <div class="form-group">
            <label for="login-password">Senha</label>
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="Digite sua senha"
              required
            />
          </div>

          <button type="submit" class="submit-btn" id="login-btn">
            Entrar
          </button>
        </form>
      </div>
    </div>

    <script>
      // API Client
      const API_BASE =
        window.location.hostname === 'localhost'
          ? 'http://localhost:5000/api'
          : 'http://backend:5000/api';

      function showMessage(containerId, message, type) {
        const messageEl = document.getElementById(containerId);
        messageEl.textContent = message;
        messageEl.className = `message show ${type}`;
        
        if (type === 'success') {
          setTimeout(() => {
            messageEl.className = 'message';
          }, 3000);
        }
      }

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('login-btn');
        
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span>';
        
        try {
          const response = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
          });
          
          const data = await response.json();
          
          if (!response.ok) {
            showMessage('login-message', data.error || 'Erro ao fazer login', 'error');
            btn.disabled = false;
            btn.innerHTML = 'Entrar';
            return;
          }
          
          // Store token
          localStorage.setItem('auth_token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          showMessage('login-message', 'Login realizado! Redirecionando...', 'success');
          setTimeout(() => {
            window.location.href = '/';
          }, 1500);
          
        } catch (error) {
          showMessage('login-message', 'Erro de conexão. Tente novamente.', 'error');
          btn.disabled = false;
          btn.innerHTML = 'Entrar';
        }
      });

      // Apply theme
      const theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    </script>
  </body>
</html>
