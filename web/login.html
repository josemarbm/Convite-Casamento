<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sistema de Convites de Casamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/enhancements.css" />
    <style>
      :root {
        --primary-color: #d96f80;
        --accent-color: #8d6ec9;
        --surface-color: rgba(255, 255, 255, 0.82);
        --text-color: #2b1f28;
        --text-secondary: #6a5059;
        --border-color: rgba(106, 80, 89, 0.14);
        --input-background: rgba(255, 255, 255, 0.7);
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: radial-gradient(circle at top, rgba(255,255,255,0.85), rgba(247,235,239,0.96) 26%, rgba(239,225,232,1) 100%);
        font-family: 'Inter', sans-serif;
        color: var(--text-color);
      }

      .login-container {
        background: var(--surface-color);
        padding: 2.25rem;
        border-radius: 28px;
        box-shadow: 0 28px 70px rgba(75, 51, 61, 0.16);
        border: 1px solid var(--border-color);
        width: min(100%, 430px);
        backdrop-filter: blur(16px);
      }

      .login-header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .login-header h1 {
        font-size: clamp(2rem, 4vw, 2.6rem);
        margin: 0;
        background: linear-gradient(135deg, #f4b7c0 0%, #d96f80 25%, #8d6ec9 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .login-header p {
        font-size: 0.92rem;
        color: var(--text-secondary);
        margin-top: 0.5rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .form-group {
        margin-bottom: 1.25rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.55rem;
        font-weight: 700;
        color: var(--text-color);
      }

      .form-group input {
        width: 100%;
        padding: 0.9rem 1rem;
        border: 1px solid var(--border-color);
        border-radius: 14px;
        font-size: 1rem;
        transition: all 0.2s ease;
        background: var(--input-background);
        color: var(--text-color);
        box-sizing: border-box;
      }

      .form-group input:focus {
        outline: none;
        border-color: rgba(217, 111, 128, 0.5);
        box-shadow: 0 0 0 4px rgba(217, 111, 128, 0.12);
      }

      .form-group input::placeholder {
        color: var(--text-secondary);
      }

      .submit-btn {
        width: 100%;
        padding: 0.95rem 1rem;
        background: linear-gradient(135deg, #f4b7c0 0%, #d96f80 32%, #8d6ec9 100%);
        color: white;
        border: none;
        border-radius: 14px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        margin-top: 0.5rem;
        box-shadow: 0 18px 38px rgba(173, 97, 120, 0.25);
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 22px 42px rgba(173, 97, 120, 0.28);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      .submit-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
      }

      .toggle-form {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.92rem;
      }

      .toggle-form a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 700;
        cursor: pointer;
      }

      .toggle-form a:hover {
        text-decoration: underline;
      }

      .message {
        padding: 0.8rem 0.9rem;
        border-radius: 12px;
        margin-bottom: 1rem;
        display: none;
        text-align: center;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .message.show {
        display: block;
      }

      .message.error {
        background: rgba(230, 109, 109, 0.12);
        color: #9d3b3b;
        border: 1px solid rgba(230, 109, 109, 0.18);
      }

      .message.success {
        background: rgba(60, 181, 140, 0.12);
        color: #1d7d5f;
        border: 1px solid rgba(60, 181, 140, 0.18);
      }

      [data-theme="dark"] {
        --primary-color: #f2a7b3;
        --accent-color: #b5a1ed;
        --surface-color: rgba(30, 23, 27, 0.86);
        --text-color: #fff5f6;
        --text-secondary: #d7c1c7;
        --border-color: rgba(255,255,255,0.08);
        --input-background: rgba(255,255,255,0.04);
      }

      .loading-spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <!-- Login Form -->
      <div id="login-form-container" class="form-container">
        <div class="login-header">
          <h1>💍</h1>
          <h1>Convites</h1>
          <p>Sistema de Casamento</p>
        </div>

        <div id="login-message" class="message"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="login-username">Usuário</label>
            <input
              type="text"
              id="login-username"
              name="username"
              placeholder="Digite seu usuário"
              required
            />
          </div>

          <div class="form-group">
            <label for="login-password">Senha</label>
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="Digite sua senha"
              required
            />
          </div>

          <button type="submit" class="submit-btn" id="login-btn">
            Entrar
          </button>
        </form>
      </div>
    </div>

    <script>
      // API Client
      const API_BASE =
        window.location.hostname === 'localhost'
          ? 'http://localhost:5000/api'
          : 'http://backend:5000/api';

      function showMessage(containerId, message, type) {
        const messageEl = document.getElementById(containerId);
        messageEl.textContent = message;
        messageEl.className = `message show ${type}`;
        
        if (type === 'success') {
          setTimeout(() => {
            messageEl.className = 'message';
          }, 3000);
        }
      }

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('login-btn');
        
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span>';
        
        try {
          const response = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
          });
          
          const data = await response.json();
          
          if (!response.ok) {
            showMessage('login-message', data.error || 'Erro ao fazer login', 'error');
            btn.disabled = false;
            btn.innerHTML = 'Entrar';
            return;
          }
          
          // Store token
          localStorage.setItem('auth_token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          showMessage('login-message', 'Login realizado! Redirecionando...', 'success');
          setTimeout(() => {
            window.location.href = '/';
          }, 1500);
          
        } catch (error) {
          showMessage('login-message', 'Erro de conexão. Tente novamente.', 'error');
          btn.disabled = false;
          btn.innerHTML = 'Entrar';
        }
      });

      // Apply theme
      const theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    </script>
  </body>
</html>
