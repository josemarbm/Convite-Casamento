<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirmação de Presença</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      .rsvp-page { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
      .rsvp-card { width: min(100%, 520px); text-align: center; }
      .rsvp-card h1 { margin-bottom: 0.75rem; }
      .rsvp-actions { display: grid; gap: 0.75rem; margin-top: 1.5rem; }
      .rsvp-actions .btn { min-height: 52px; }
      .rsvp-result { font-size: 1.1rem; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main class="rsvp-page">
      <section class="card rsvp-card">
        <p class="tab-icon">💍</p>
        <h1>Confirmação de presença</h1>
        <p id="rsvp-content" class="help-text">Carregando convite…</p>
        <div id="rsvp-actions" class="rsvp-actions" hidden>
          <button id="confirm-btn" class="btn btn-success">✅ Confirmar presença</button>
          <button id="decline-btn" class="btn btn-secondary">❌ Não vou conseguir ir</button>
        </div>
      </section>
    </main>
    <script src="js/rsvp.js"></script>
  </body>
</html>
