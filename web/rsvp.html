<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirmação de Presença</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      :root {
        --primary: #d96f80;
        --secondary: #8d6ec9;
        --bg: radial-gradient(circle at top, rgba(255,255,255,0.85), rgba(249,238,240,0.95) 30%, rgba(238,227,233,1) 100%);
        --card: rgba(255,255,255,0.8);
        --text: #2c1f28;
        --muted: #6a5059;
        --border: rgba(106, 80, 89, 0.12);
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        font-family: 'Inter', sans-serif;
        color: var(--text);
      }

      .rsvp-page {
        width: 100%;
        display: grid;
        place-items: center;
      }

      .rsvp-card {
        width: min(100%, 560px);
        text-align: center;
        padding: 2.2rem 2rem;
        border-radius: 28px;
        border: 1px solid var(--border);
        background: var(--card);
        box-shadow: 0 28px 64px rgba(75, 51, 61, 0.16);
        backdrop-filter: blur(18px);
      }

      .rsvp-card h1 {
        margin: 0.5rem 0 0.9rem;
        font-size: clamp(2rem, 4vw, 2.6rem);
        background: linear-gradient(135deg, #f4b7c0 0%, #d96f80 32%, #8d6ec9 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .rsvp-card .tab-icon {
        font-size: 2.3rem;
        margin: 0;
      }

      .help-text {
        color: var(--muted);
        font-size: 1.03rem;
        line-height: 1.7;
      }

      .rsvp-actions {
        display: grid;
        gap: 0.8rem;
        margin-top: 1.5rem;
      }

      .rsvp-actions .btn {
        min-height: 54px;
        justify-content: center;
      }

      .rsvp-result {
        font-size: 1.1rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="rsvp-page">
      <section class="card rsvp-card">
        <p class="tab-icon">💍</p>
        <h1>Confirmação de presença</h1>
        <p id="rsvp-content" class="help-text">Carregando convite…</p>
        <div id="rsvp-actions" class="rsvp-actions" hidden>
          <button id="confirm-btn" class="btn btn-success">✅ Confirmar presença</button>
          <button id="decline-btn" class="btn btn-secondary">❌ Não vou conseguir ir</button>
        </div>
      </section>
    </main>
    <script src="js/rsvp.js"></script>
  </body>
</html>
