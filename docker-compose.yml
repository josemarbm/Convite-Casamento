services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding-app
    ports:
      - "3000:3000"
    environment:
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=12345
      - EVOLUTION_SESSION_ID=default
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-wedding-invitation-secret-key-change-in-prod}
      - DATABASE_URL=mysql://wedding_user:wedding_pass_2024@mysql:3306/wedding_invites
      - UPLOAD_DIR=/app/uploads
    volumes:
      - app_uploads:/app/uploads
    networks:
      - wedding-network
    restart: unless-stopped

volumes:
  app_uploads:
    driver: local

networks:
  wedding-network:
    external: true
    name: wedding_shared_net
